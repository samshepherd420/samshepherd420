<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuji – Svema (Spain)</title>

<style>
body {
    margin: 20px;
    background: #f5f5f5;
    color: #111;
    font-family: sans-serif;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #444;
    font-size: 0.95em;
}
.back-link:hover {
    color: #000;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.grid img {
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
}
.grid img:hover {
    opacity: 0.9;
}

/* Caption under thumbnails */
.caption {
    font-size: 0.85em;
    color: #666;
    margin-top: 4px;
    text-align: center;
}

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    object-fit: contain;
}

/* Lightbox caption */
#lightbox-caption {
    color: white;
    text-align: center;
    margin-top: 10px;
    font-size: 1em;
}

/* Arrows */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 50px;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    user-select: none;
    padding: 10px;
}
.arrow:hover {
    color: white;
}

#lightbox-left { left: 20px; }
#lightbox-right { right: 20px; }

/* Download button */
.download-btn {
    text-align: center;
    margin-top: 15px;
}
.download-btn a {
    color: white;
    background: rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    transition: 0.2s;
}
.download-btn a:hover {
    background: rgba(255,255,255,0.35);
}
</style>
</head>
<body>

<div class="container">

    <a class="back-link" href="index.html">← Back to all films</a>

    <h1>Fuji – Svema (Spain)</h1>

    <p>
        Shot on a <strong>Fujica</strong> with <strong>Svema</strong> film.<br>
        Developed in <strong>Rodinal</strong>.
    </p>

    <h2>Landscape</h2>
    <div id="landscape" class="grid"></div>

    <h2>Portrait</h2>
    <div id="portrait" class="grid"></div>

    <p style="text-align:center; margin-top:40px;">
        <a class="back-link" href="index.html">← Back to all films</a>
    </p>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span id="lightbox-left" class="arrow">&#10094;</span>
    <div>
        <img id="lightbox-img">
        <div id="lightbox-caption"></div>
        <div class="download-btn">
            <a id="download-link" target="_blank">Download full size</a>
        </div>
    </div>
    <span id="lightbox-right" class="arrow">&#10095;</span>
</div>

<script>
// EXACT SAME SYSTEM AS YOUR ILFORD PAGE
// --------------------------------------

// Filenames r001-002.jpg → r001-033.jpg
const files = [];
for (let i = 2; i <= 33; i++) {
    const n = String(i).padStart(3, '0');
    files.push(`r001-${n}.jpg`);
}

// YOUR MANUAL CAPTIONS
// ✏️ FILL THESE YOURSELF (kept empty exactly as you asked)
const captions = {
    "r001-002.jpg": "",
    "r001-003.jpg": "",
    "r001-004.jpg": "",
    "r001-005.jpg": "",
    "r001-006.jpg": "",
    "r001-007.jpg": "",
    "r001-008.jpg": "",
    "r001-009.jpg": "",
    "r001-010.jpg": "",
    "r001-011.jpg": "",
    "r001-012.jpg": "",
    "r001-013.jpg": "",
    "r001-014.jpg": "",
    "r001-015.jpg": "",
    "r001-016.jpg": "",
    "r001-017.jpg": "",
    "r001-018.jpg": "",
    "r001-019.jpg": "",
    "r001-020.jpg": "",
    "r001-021.jpg": "",
    "r001-022.jpg": "",
    "r001-023.jpg": "",
    "r001-024.jpg": "",
    "r001-025.jpg": "",
    "r001-026.jpg": "",
    "r001-027.jpg": "",
    "r001-028.jpg": "",
    "r001-029.jpg": "",
    "r001-030.jpg": "",
    "r001-031.jpg": "",
    "r001-032.jpg": "",
    "r001-033.jpg": ""
};

const landscape = document.getElementById("landscape");
const portrait = document.getElementById("portrait");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxCaption = document.getElementById("lightbox-caption");
const downloadLink = document.getElementById("download-link");

let currentIndex = 0;
const allImages = [];

// Load thumbnails + categorize
files.forEach((f, i) => {
    const thumb = new Image();
    thumb.src = "photos/fuji-svema-spain/thumbs/" + f;

    thumb.onload = () => {
        const wrap = document.createElement("div");

        wrap.appendChild(thumb);

        const cap = document.createElement("div");
        cap.className = "caption";
        cap.textContent = captions[f] || "";
        wrap.appendChild(cap);

        const mediumPath = "photos/fuji-svema-spain/medium/" + f;
        const fullPath = "photos/fuji-svema-spain/full/" + f;

        allImages.push({ medium: mediumPath, full: fullPath, file: f });

        if (thumb.width > thumb.height) {
            landscape.appendChild(wrap);
        } else {
            portrait.appendChild(wrap);
        }

        thumb.addEventListener("click", () => {
            currentIndex = i;
            showImage();
        });
    };
});

function showImage() {
    const { medium, full, file } = allImages[currentIndex];
    lightboxImg.src = medium;
    downloadLink.href = full;
    lightboxCaption.textContent = captions[file] || "";
    lightbox.style.display = "flex";
}

// Close on background click
lightbox.addEventListener("click", e => {
    if (e.target === lightbox) lightbox.style.display = "none";
});

// Arrows
document.getElementById("lightbox-left").onclick = e => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
    showImage();
};
document.getElementById("lightbox-right").onclick = e => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % allImages.length;
    showImage();
};

// Keyboard
document.addEventListener("keydown", e => {
    if (lightbox.style.display !== "flex") return;

    if (e.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
        showImage();
    }
    if (e.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % allImages.length;
        showImage();
    }
    if (e.key === "Escape") lightbox.style.display = "none";
});
</script>

</body>
</html>
