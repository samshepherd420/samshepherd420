<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuji – Svema (Spain)</title>

<style>
body {
    margin: 20px;
    background: #f5f5f5;
    color: #111;
    font-family: sans-serif;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #444;
    font-size: 0.95em;
}
.back-link:hover {
    color: #000;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.grid img {
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
}
.grid img:hover {
    opacity: 0.9;
}

/* Caption under thumbnails */
.caption {
    font-size: 0.85em;
    color: #666;
    margin-top: 4px;
    text-align: center;
}

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    object-fit: contain;
}

/* Lightbox caption */
#lightbox-caption {
    color: white;
    text-align: center;
    margin-top: 10px;
    font-size: 1em;
}

/* Arrows */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 50px;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    user-select: none;
    padding: 10px;
}
.arrow:hover {
    color: white;
}

#lightbox-left { left: 20px; }
#lightbox-right { right: 20px; }

/* Download button */
.download-btn {
    text-align: center;
    margin-top: 15px;
}
.download-btn a {
    color: white;
    background: rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    transition: 0.2s;
}
.download-btn a:hover {
    background: rgba(255,255,255,0.35);
}
</style>
</head>
<body>

<div class="container">

    <a class="back-link" href="index.html">← Back to all films</a>

    <h1>Fuji – Svema (Spain)</h1>

    <p>
        Shot on a <strong>Fujica</strong> with <strong>Svema</strong> film.<br>
        Developed in <strong>Rodinal</strong>.
    </p>

    <h2>Landscape</h2>
    <div id="landscape" class="grid"></div>

    <h2>Portrait</h2>
    <div id="portrait" class="grid"></div>

    <p style="text-align:center; margin-top:40px;">
        <a class="back-link" href="index.html">← Back to all films</a>
    </p>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span id="lightbox-left" class="arrow">&#10094;</span>
    <div>
        <img id="lightbox-img">
        <div id="lightbox-caption"></div>
        <div class="download-btn">
            <a id="download-link" target="_blank">Download full size</a>
        </div>
    </div>
    <span id="lightbox-right" class="arrow">&#10095;</span>
</div>

<script>
// Filenames + captions (your custom list)
const files = [
  { filename: "r001-002.jpg", caption: "Wishing upon a vape" },
  { filename: "r001-003.jpg", caption: "Cartagenal" },
  { filename: "r001-004.jpg", caption: "Is it working?" },
  { filename: "r001-005.jpg", caption: "Above rhe doorway" },
  { filename: "r001-006.jpg", caption: "Monument" },
  { filename: "r001-007.jpg", caption: "Disgusting" },
  { filename: "r001-008.jpg", caption: "Filth" },
  { filename: "r001-009.jpg", caption: "That same face" },
  { filename: "r001-010.jpg", caption: "Zero for the child" },
  { filename: "r001-011.jpg", caption: "Hike part 1" },
  { filename: "r001-012.jpg", caption: "The end of the trail" },
  { filename: "r001-013.jpg", caption: "Warbles" },
  { filename: "r001-014.jpg", caption: "Clouds over the military base" },
  { filename: "r001-015.jpg", caption: "Self timer 1, let me hold the 7 week pregnant belly" },
  { filename: "r001-016.jpg", caption: "Normal couple picture" },
  { filename: "r001-017.jpg", caption: "Incline" },
  { filename: "r001-018.jpg", caption: "Watermark" },
  { filename: "r001-019.jpg", caption: "Probably could have removed this one" },
  { filename: "r001-020.jpg", caption: "Abandoned entry point" },
  { filename: "r001-021.jpg", caption: "Holy fuck i'm going to be sick" },
  { filename: "r001-022.jpg", caption: "I never want to see this view again" },
  { filename: "r001-023.jpg", caption: "The same can be said about this" },
  { filename: "r001-024.jpg", caption: "One day was enough here" },
  { filename: "r001-025.jpg", caption: "If this were colour, it would be orange" },
  { filename: "r001-026.jpg", caption: "Upon another peak" },
  { filename: "r001-027.jpg", caption: "I'm no expert but it looks like shale" },
  { filename: "r001-028.jpg", caption: "Some shrub" },
  { filename: "r001-029.jpg", caption: "Sand dune deposits" },
  { filename: "r001-030.jpg", caption: "Obviously posed" },
  { filename: "r001-031.jpg", caption: "And that's the beach" },
  { filename: "r001-032.jpg", caption: "The towers of altamira (I recall when I was small)" },
  { filename: "r001-033.jpg", caption: "NOT related to squid game" }
];

const landscape = document.getElementById("landscape");
const portrait = document.getElementById("portrait");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxCaption = document.getElementById("lightbox-caption");
const downloadLink = document.getElementById("download-link");

let currentIndex = 0;
const allImages = [];

// Load thumbnails
files.forEach((f, i) => {
    const thumb = new Image();
    thumb.src = "photos/fuji-svema-spain/thumbs/" + f.filename;

    thumb.onload = () => {
        const wrap = document.createElement("div");
        wrap.appendChild(thumb);

        const cap = document.createElement("div");
        cap.className = "caption";
        cap.textContent = f.caption;
        wrap.appendChild(cap);

        const mediumPath = "photos/fuji-svema-spain/medium/" + f.filename;
        const fullPath = "photos/fuji-svema-spain/full/" + f.filename;

        allImages.push({ medium: mediumPath, full: fullPath, caption: f.caption });

        if (thumb.width > thumb.height) {
            landscape.appendChild(wrap);
        } else {
            portrait.appendChild(wrap);
        }

        thumb.addEventListener("click", () => {
            currentIndex = i;
            showImage();
        });
    };
});

function showImage() {
    const { medium, full, caption } = allImages[currentIndex];
    lightboxImg.src = medium;
    downloadLink.href = full;
    lightboxCaption.textContent = caption;
    lightbox.style.display = "flex";
}

// Close on background click
lightbox.addEventListener("click", e => {
    if (e.target === lightbox) lightbox.style.display = "none";
});

// Arrows
document.getElementById("lightbox-left").onclick = e => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
    showImage();
};
document.getElementById("lightbox-right").onclick = e => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % allImages.length;
    showImage();
};

// Keyboard controls
document.addEventListener("keydown", e => {
    if (lightbox.style.display !== "flex") return;

    if (e.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
        showImage();
    }
    if (e.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % allImages.length;
        showImage();
    }
    if (e.key === "Escape") lightbox.style.display = "none";
});
</script>


</body>
</html>
